[project]
name = "foxduplicatefinder"
version = "0.3.0"
description = "Duplicate photo/video finder with optional NSFW analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pillow>=10.0",
  "imagehash>=4.3",
]

[project.scripts]
foxdup = "foxduplicatefinder.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
